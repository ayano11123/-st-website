{% extends "admin/base.html" %}{% set page='Banners' %}
{% block body %}
<h1>Homepage banner</h1><p class="hint" style="margin-bottom:12px">The first active banner (lowest order) controls the homepage headline, sub-heading and optional hero photo.</p>
{% for b in rows %}<form method="post" enctype="multipart/form-data" class="panel fl form-grid" style="margin-bottom:12px"><input type="hidden" name="_csrf" value="{{ csrf() }}"><input type="hidden" name="id" value="{{ b.id }}">
<div><label>Headline (English)</label><input name="title_en" value="{{ b.title_en }}"></div><div><label>शीर्षक (हिंदी)</label><input name="title_hi" value="{{ b.title_hi }}"></div>
<div><label>Sub-heading (English)</label><input name="subtitle_en" value="{{ b.subtitle_en }}"></div><div><label>उप-शीर्षक (हिंदी)</label><input name="subtitle_hi" value="{{ b.subtitle_hi }}"></div>
<div><label>Link</label><input name="link" value="{{ b.link }}"></div><div><label>Order</label><input name="sort" type="number" value="{{ b.sort }}"></div>
<div class="full">{% if b.image %}<img src="{{ b.image }}" style="width:200px;border-radius:12px" alt=""><label><input type="checkbox" name="remove_image"> remove photo</label><br>{% endif %}<label>Hero photo (optional, replaces the illustration)</label><input type="file" name="image" accept="image/*"></div>
<div class="full"><label><input type="checkbox" name="active" {{ 'checked' if b.active }}> Active</label> &nbsp; <button class="btn btn-green btn-sm" name="action" value="save">Save</button> <button class="btn btn-sm" style="background:#fde8e5;color:#8a2218" name="action" value="delete" data-confirm="Delete this banner?">Delete</button></div></form>{% endfor %}
<fieldset><legend>Add a banner</legend><form method="post" enctype="multipart/form-data" class="form-grid fl"><input type="hidden" name="_csrf" value="{{ csrf() }}"><input type="hidden" name="action" value="add"><input type="hidden" name="active" value="1">
<div><label>Headline (English)</label><input name="title_en" required></div><div><label>शीर्षक (हिंदी)</label><input name="title_hi"></div><div><label>Sub-heading (English)</label><input name="subtitle_en"></div><div><label>उप-शीर्षक (हिंदी)</label><input name="subtitle_hi"></div>
<div><label>Link</label><input name="link" value="/shop"></div><div><label>Order</label><input name="sort" type="number" value="10"></div><div class="full"><label>Photo</label><input type="file" name="image" accept="image/*"></div><div class="full"><button class="btn btn-green">Add banner</button></div></form></fieldset>
{% endblock %}
